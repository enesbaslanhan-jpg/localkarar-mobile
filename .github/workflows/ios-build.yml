name: iOS Platform & Simulator Build

# Daller KALIBA cevrildi. Onceki halinde tek tek yaziliyorlardi
# (feature/m7-..., feature/m8-...); her yeni dal icin bu dosyayi duzenlemek
# gerekiyordu ve duzenlenmediginde is SESSIZCE hic kosmuyordu -- basarisiz
# olmuyor, sadece yok. Unutulmasi kacinilmaz bir kurulumdu.
on:
  push:
    branches:
      - main
      # Calisma dali; listede yoktu ve is hic kosmuyordu.
      - design
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ios-build-and-verify:
    name: macOS iOS Build & Simulator Verification
    # 🔴 macos-14 DEGIL macos-15: arac zinciri Compose icin FAZLA ESKIYDI.
    #
    # macos-14 Xcode 15.4 tasiyor, yani iOS 17.5 SDK. Compose Multiplatform
    # 1.11.1'in `ui-uikit` katmani UIKit'in `UIViewLayoutRegion` sinifini
    # cagiriyor ve o sinif iOS 18 ile geldi. Baglayici (ld) simgeyi
    # bulamayinca test ikilisi linklenemiyor:
    #
    #   Undefined symbols for architecture arm64:
    #     "_OBJC_CLASS_$_UIViewLayoutRegion", referenced from:
    #        in liborg.jetbrains.compose.ui:ui-uikit-cache.a
    #
    # ⚠️ NEDEN BU ARIZA DAHA ONCE GORUNMEDI: is akisi eskiden yalniz
    # FRAMEWORK linkliyordu (`linkDebugFrameworkIosSimulatorArm64`). Statik
    # framework'te disaridan gelen ObjC simgeleri COZULMEDEN kalabilir --
    # onlar uygulama Xcode'da linklenirken cozulur. Birim testi adimi
    # eklenince ilk kez bir CALISTIRILABILIR linklendi ve calistirilabilir
    # her simgenin cozulmesini SART kosuyor. Yani ariza yeni degil, yeni
    # gorunur oldu; 2 Eylul'deki yesil kosu bu adimi hic icermiyordu.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Surum ACIKCA secildi. Varsayilana birakilirsa GitHub imaji
      # guncellendiginde Xcode sessizce degisir ve ayni ariza geri doner --
      # ustelik bu sefer "dun calisiyordu" diye.
      - name: Xcode 16+ seç
        run: |
          set -euo pipefail
          echo "=== Kurulu Xcode surumleri ==="
          ls -d /Applications/Xcode*.app || true

          # 🔴 SURUM ARALIGI KULLANILMIYOR — bu bir kez zaten yanlis gitti.
          #
          # Onceki hali `Xcode_1[6-9]*.app` kalibiyla ariyordu. Apple
          # surum numaralandirmasini 26'ya ATLADI (yil ile esleseacek
          # sekilde), yani makinedeki `Xcode_26.x.app` bu kalibi HIC
          # tutmuyor ve is sessizce 16.4'e dusuyordu. Sonuc: iOS 18.5
          # SDK'siyla link ve "UIViewLayoutRegion bulunamadi" hatasi.
          #
          # Artik kalip yok: kurulu TUM Xcode'lar surume gore siralanip
          # EN YENISI seciliyor. Apple bir daha numaralandirmayi
          # degistirse de bu satirin duzeltilmesi gerekmiyor.
          SECILEN=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SECILEN" ]; then
            echo "HATA: Hic Xcode bulunamadi."
            exit 1
          fi

          echo "Secilen: $SECILEN"
          sudo xcode-select -s "$SECILEN/Contents/Developer"
          xcodebuild -version

      - name: Toolchain & System Discovery
        run: |
          # 🔴 KOSU KENDINI TANITIYOR.
          #
          # Once bir ayar degisikligi yapildi ama sonraki log AYNI hatayi
          # verdi ve log'dan o degisikligin runner'a ULASIP ULASMADIGI
          # anlasilamadi -- "eski kosunun log'u mu, yeni mi" sorusu
          # cevapsiz kaldi. Bir daha kalmasin.
          echo "=== Kosulan commit ==="
          git log -1 --oneline
          echo "=== Kotlin/Native onbellek ayari ==="
          grep -n "cacheKind" gradle.properties || echo "(cacheKind satiri YOK)"
          echo "=== System Information ==="
          uname -a
          uname -m
          sw_vers
          echo "=== Java Version ==="
          java -version
          echo "=== Xcode Version ==="
          xcodebuild -version
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

      - name: Discover and Select iOS Simulator
        id: sim_discovery
        run: |
          echo "=== Discovering Available iOS Simulators ==="
          xcrun simctl list runtimes
          xcrun simctl list devices available
          
          # Find first available iPhone simulator
          SIM_LINE=$(xcrun simctl list devices available | grep -i "iPhone" | head -n 1)
          echo "Selected simulator raw line: $SIM_LINE"
          
          SIM_UDID=$(echo "$SIM_LINE" | grep -o -E '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -n 1)
          SIM_NAME=$(echo "$SIM_LINE" | sed -E 's/^[[:space:]]*//; s/[[:space:]]*\([0-9A-Fa-f-]+\).*//')
          
          if [ -z "$SIM_UDID" ]; then
            echo "Failed to dynamically discover iPhone simulator UDID. Listing all available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          
          echo "DISCOVERED_SIM_NAME=$SIM_NAME" >> $GITHUB_ENV
          echo "DISCOVERED_SIM_UDID=$SIM_UDID" >> $GITHUB_ENV
          echo "Discovered Simulator Name: $SIM_NAME"
          echo "Discovered Simulator UDID: $SIM_UDID"

      # 🔴 set -o pipefail ZORUNLU.
      #
      # `./gradlew ... | tee log` kaliginda adimin cikis kodu TEE'DEN gelir.
      # GitHub Actions bash'i varsayilan olarak pipefail ile calismaz, yani
      # gradle derlemesi DUSSE BILE adim yesil goruunuyordu -- CI, kirik kodu
      # gecirir hale gelmisti.
      - name: Compile Kotlin iOS Simulator Target
        run: |
          set -o pipefail
          echo "=== Compiling Kotlin iosSimulatorArm64 ==="
          mkdir -p artifacts
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace 2>&1 | tee artifacts/gradle_compile.log

      - name: Link Kotlin iOS Debug Framework
        run: |
          set -o pipefail
          echo "=== Linking Debug Framework iosSimulatorArm64 ==="
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace 2>&1 | tee artifacts/gradle_link.log

      - name: Build Xcode Simulator Application
        run: |
          echo "=== Building Xcode Project for Simulator (UDID: $DISCOVERED_SIM_UDID) ==="
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination "id=$DISCOVERED_SIM_UDID" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee artifacts/xcode_build.log

      - name: Boot Simulator, Install and Launch App
        run: |
          echo "=== Booting Simulator $DISCOVERED_SIM_UDID ==="
          xcrun simctl boot "$DISCOVERED_SIM_UDID" || true
          sleep 10
          
          echo "=== Locating Built Application ==="
          APP_PATH=$(find build/DerivedData/Build/Products -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -type d -name "*.app" | head -n 1)
          fi
          echo "Found .app at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Application bundle not found!"
            exit 1
          fi
          
          echo "=== Ad-hoc Signing App for Simulator ==="
          codesign --force --deep --sign - "$APP_PATH" || true
          
          echo "=== Application Info.plist ==="
          plutil -p "$APP_PATH/Info.plist" || cat "$APP_PATH/Info.plist" || true
          
          echo "=== Installing Application on Simulator ==="
          xcrun simctl install "$DISCOVERED_SIM_UDID" "$APP_PATH" 2>&1 | tee artifacts/simctl_install.log
          
          echo "=== Launching Application ==="
          xcrun simctl launch "$DISCOVERED_SIM_UDID" com.localkarar.app 2>&1 | tee artifacts/simctl_launch.log || true
          
          echo "=== Waiting for App Initialization ==="
          sleep 10
          
          echo "=== Capturing Simulator Screenshot ==="
          mkdir -p artifacts
          xcrun simctl io "$DISCOVERED_SIM_UDID" screenshot artifacts/simulator_screenshot.png 2>&1 | tee artifacts/screenshot.log || true
          
          echo "=== Checking Running App Processes ==="
          xcrun simctl spawn "$DISCOVERED_SIM_UDID" ps aux | grep -i "localkarar" || true
          
          echo "=== Simulator Lifecycle Verification Complete ==="

      # 🔴 BIRIM TESTLERI EN SONA ALINDI — bilerek.
      #
      # Bu isin adi "iOS Platform & Simulator Build": asil isi uygulamanin
      # derlenip simulatorde acildigini kanitlamak. Birim testleri bonus,
      # cunku ayni commonTest testleri Android isinde de kosuyor.
      #
      # Test ADIMI ortada dururken, onun link hatasi kendinden SONRAKI her
      # seyi (framework linki, Xcode derlemesi, simulatorde acilis)
      # kosturmadan bloke ediyordu. Bu dalda o adimlarin hicbiri henuz
      # kosmadi ve her denemede 12 dakika harcanip tek bir bilgi
      # aliniyordu. Sona alinca bir kosu HEPSINI birden soyluyor.
      #
      # ⚠️ Adim hala isi DUSURUYOR (continue-on-error YOK): dusen bir test
      # yesil gorunmemeli. Yalnizca sirasi degisti.
      - name: Birim testleri (iOS simulator hedefi)
        run: |
          set -o pipefail
          ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace 2>&1 | tee artifacts/gradle_test.log

      - name: Upload Build Artifacts & Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-evidence
          path: |
            artifacts/*
            build/DerivedData/Logs/Build/*.xcactivitylog
          if-no-files-found: warn
