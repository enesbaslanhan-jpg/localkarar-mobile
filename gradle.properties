org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true

# 🔴 iOS SIMULATOR ONBELLEGI KAPALI — link hatasinin gercek sebebi buydu.
#
# Belirti:
#   Undefined symbols for architecture arm64:
#     "_OBJC_CLASS_$_UIViewLayoutRegion", referenced from:
#        in liborg.jetbrains.compose.ui:ui-uikit-cache.a
#
# Dikkat: simge, adinda "-cache" gecen bir arsivden geliyor. Yani hata
# ui-uikit'in KENDISINDE degil, onun ONBELLEGE ALINMIS derlemesinde.
# Ayni log'daki su uyari da bunu soyluyor:
#   object file (...skiko-cache.a) was built for newer 'iOS-simulator'
#   version (18.5) than being linked (15.0)
# Onbellek 18.5 icin uretilmis, baglama ise 15.0 ile yapiliyor.
#
# NEDEN ONEMLI: Kotlin/Native bir klib'i DOGRUDAN derlediginde, dagitim
# hedefinde bulunmayan Objective-C siniflarina ZAYIF (weak) referans
# uretir -- sinif yoksa calisma aninda nil olur, link kirilmaz. Onbellege
# alinmis arsiv ise baska bir ortamin ayarlariyla uretildigi icin sert
# referans tasiyor ve baglayici onu cozemiyor.
#
# ⚠️ DAGITIM HEDEFI YUKSELTILMEDI. "IPHONEOS_DEPLOYMENT_TARGET = 18.0"
# yapmak hatayi susturur ama uygulamayi yalniz iOS 18+ cihazlarda
# calisir hale getirir; bu bir derleme ayari degil, hangi musteriye
# satildigi kararidir ve oyle verilmez. Hedef 14.1 olarak KALIYOR.
#
# Bedeli: onbelleksiz link daha yavas. CI'da kabul edilebilir (is 45
# dakika sinirinda, kosu ~12 dakika).
#
# ⚠️ Yalniz simulator hedefi kapatildi. Cihaz hedefi (iosArm64) CI'da hic
# linklenmiyor; oradaki davranis OLCULMEDI. Cihaz derlemesi ayni hatayi
# verirse ayni satir iosArm64 icin de yazilmali -- tahminle simdiden
# yazip yerel derlemeleri yavaslatmiyoruz.
kotlin.native.cacheKind.iosSimulatorArm64=none